name: Update GetGasCert enabled production

on:
  push:
    branches:
      - main
    paths:
      - deployment-authorizations/ggc-enabled-production-update-2026-08-13.json

permissions:
  contents: read

concurrency:
  group: evenai-ggc-production-canary
  cancel-in-progress: false

env:
  GGC_ENABLED_UPDATE_AUTHORIZATION_PATH: deployment-authorizations/ggc-enabled-production-update-2026-08-13.json

jobs:
  update-enabled-production:
    name: Update and verify enabled GGC Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-disabled

    steps:
      - name: Check out authorized control plane
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run full repository test suite
        env:
          GITHUB_STEP_SUMMARY: ""
          GITHUB_OUTPUT: ""
        run: npm test

      - name: Require explicit update authorization
        run: test -s "$GGC_ENABLED_UPDATE_AUTHORIZATION_PATH"

      - name: Update enabled production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UPDATE_RUN_ID: ${{ github.run_id }}
        run: node scripts/update-ggc-enabled-production.mjs --update

      - name: Upload update evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: ggc-enabled-production-update-evidence
          path: ggc-enabled-update-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Restore previous enabled version after failure
        if: ${{ failure() && hashFiles('ggc-enabled-update-plan.json') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UPDATE_RUN_ID: ${{ github.run_id }}
        run: node scripts/update-ggc-enabled-production.mjs --rollback

      - name: Upload rollback evidence
        if: ${{ always() && hashFiles('ggc-enabled-update-rollback-evidence.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ggc-enabled-production-update-rollback-evidence
          path: ggc-enabled-update-rollback-evidence.json
          if-no-files-found: error
          retention-days: 90
